<!DOCTYPE html>
<html>
<head>
  <title>Companion Interface</title>

  <style>
    body {
      margin: 0;
      background: #0f0f1a;
      color: white;
      font-family: Arial;
      height: 100vh;
      overflow: hidden;
    }

    /* CHARACTER */
    .character {
      height: 90%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .character img {
      width: 650px;
      height: 100%;
      object-fit: contain;
    }

    /* DIALOGUE BOX */
    .dialogue {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 30vh;
      background: #1a1a2e;
      border-top: 3px solid #00d4ff;
      padding: 20px;
      box-sizing: border-box;
    }

    .name {
      font-weight: bold;
      color: #00d4ff;
      margin-bottom: 10px;
    }

    #reply {
      font-size: 16px;
      min-height: 50px;
    }

    input {
      width: 80%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      outline: none;
      margin-top: 10px;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: #00d4ff;
      font-weight: bold;
      cursor: pointer;
    }

    #loading {
      display: none;
      font-size: 12px;
      opacity: 0.6;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<div class="character">
  <img id="nyx-img" src="/static/neutral.png">
</div>

<div class="dialogue">

  <div class="name">Companion</div>

  <div id="reply">...</div>

  <input id="msg" placeholder="Talk to Companion...">
  <button onclick="send()">Send</button>

  <div id="loading">Companion is thinking...</div>

</div>

<script>

const emotionMap = {
  neutral: "/static/neutral.png",
  "cutely-annoyed": "/static/cutely-annoyed.png",
  explaining: "/static/explaining.png"
};

async function send() {

  const msg = document.getElementById("msg").value;
  if (!msg) return;

  document.getElementById("loading").style.display = "block";

  const res = await fetch("/companion", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      message: msg,
      mode: "idle",
      trust: 0.5
    })
  });

  const data = await res.json();

  document.getElementById("loading").style.display = "none";

  document.getElementById("reply").innerText =
    data.response || "...";

  const emotion = (data.emotion || "neutral").toLowerCase().trim();

  document.getElementById("nyx-img").src =
    emotionMap[emotion] || emotionMap.neutral;
}

</script>

</body>
</html>
